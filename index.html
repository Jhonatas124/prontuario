<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prontuário">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF3F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1616" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Prontuário de Bolso</title>
<style>
:root{
  --bg:#EEF3F3; --surface:#FFFFFF; --surface-2:#E2EBEB; --ink:#0F2526; --muted:#587071;
  --line:#D5E0E0; --line-strong:#AFC2C2;
  --accent:#1B7272; --accent-ink:#FFFFFF; --accent-soft:#D5EAE9;
  --gold:#B87708; --gold-soft:#FBEBCF;
  --ok:#23794E; --ok-soft:#D8EFE2; --bad:#B63A30; --bad-soft:#F6DDDA;
  --scrim:rgba(8,24,24,.38);
  --radius:14px; --tabbar:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1616; --surface:#122222; --surface-2:#1B2F2F; --ink:#E2EDED; --muted:#8FA8A8;
    --line:#223737; --line-strong:#3B5555;
    --accent:#3BB2AC; --accent-ink:#032120; --accent-soft:#143A3A;
    --gold:#F2AE45; --gold-soft:#382B14;
    --ok:#56C58F; --ok-soft:#12342A; --bad:#F2837A; --bad-soft:#3E1D1A;
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0B1616; --surface:#122222; --surface-2:#1B2F2F; --ink:#E2EDED; --muted:#8FA8A8;
    --line:#223737; --line-strong:#3B5555;
    --accent:#3BB2AC; --accent-ink:#032120; --accent-soft:#143A3A;
    --gold:#F2AE45; --gold-soft:#382B14;
    --ok:#56C58F; --ok-soft:#12342A; --bad:#F2837A; --bad-soft:#3E1D1A;
    --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
[hidden]{display:none!important}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.num{font-variant-numeric:tabular-nums}

main{max-width:560px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 28px);
  padding-left:16px;padding-right:16px;display:flex;flex-direction:column;gap:16px}

h1{font-size:28px;line-height:1.12;margin:0;font-weight:750;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:19px;line-height:1.2;margin:0;font-weight:700;text-wrap:balance}
h2.sec{margin-top:8px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
.btn{appearance:none;border:0;font-weight:650;font-size:16px;border-radius:12px;padding:11px 16px;min-height:46px;
  background:var(--surface-2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;color:var(--accent);padding-left:6px;padding-right:6px}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:8px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.icon-btn:focus-visible,.row-btn:focus-visible,.task:focus-visible,.tabbar button:focus-visible,.mk-card:focus-visible,.quick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--ink);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:disabled{opacity:.3}
.icon-btn.soft{background:var(--surface-2)}
.icon-btn.danger{color:var(--bad)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row-btn{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;min-height:58px}
.rb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rb-main b{font-weight:650}
.rb-side{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;flex:none}
.empty{padding:22px 18px;text-align:center;border:1.5px dashed var(--line-strong);border-radius:var(--radius);color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);max-width:100%;line-height:1.3}
.chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip svg{flex:none}
.k-casa{background:var(--accent-soft);color:var(--accent)}
.k-saude{background:var(--bad-soft);color:var(--bad)}
.k-academia{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.low{background:var(--gold-soft);color:var(--gold)}

/* install banner */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:var(--radius);padding:12px 8px 12px 14px;font-size:14px}
.banner p{margin:0;flex:1}

/* hoje */
.day-head{display:flex;align-items:center;gap:6px}
.day-title{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:2px}
.day-title h1{font-size:23px}
.progress{display:flex;align-items:center;gap:16px}
.ring{flex:none}
.ring .bg{stroke:var(--surface-2)} .ring .fg{stroke:var(--accent);transition:stroke-dashoffset .35s ease}
.ring text{fill:var(--ink);font-weight:750;font-size:17px}
.progress .p-txt{display:flex;flex-direction:column;gap:3px}
.progress .p-txt b{font-size:17px}
.streak{display:inline-flex;align-items:center;gap:6px;color:var(--gold);font-weight:650;font-size:14px}
.task{appearance:none;border:0;background:transparent;width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:12px 14px;min-height:58px;cursor:pointer}
.task .box{width:27px;height:27px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.task.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task .tname{display:flex;flex-direction:column;gap:1px;font-weight:600;min-width:0}
.task.on .tname>span{color:var(--muted)}
.task .tname small{font-weight:500;color:var(--muted);font-size:12.5px}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2);display:block}
.dots i.y{background:var(--accent)}
.dots i.cur{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--line-strong)}
.quick{appearance:none;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;text-align:left}
.quick .q-ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.quick .q-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.legend-7{display:flex;justify-content:flex-end;padding:0 14px;margin-top:-8px}

/* peso */
.hero-w{display:flex;flex-direction:column;gap:10px}
.big-num{font-size:52px;font-weight:750;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.big-num small{font-size:22px;font-weight:650;color:var(--muted);letter-spacing:0;margin-left:4px}
.delta{font-weight:650;font-size:15px}
.delta.up{color:var(--bad)} .delta.down{color:var(--ok)} .delta.eq{color:var(--muted)}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:14px;font-weight:650;color:var(--muted);cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10.5px;font-family:inherit}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.chart .end-lbl{fill:var(--ink);font-size:12px;font-weight:700}
.chart .band{fill:var(--ok);opacity:.12}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-variant-numeric:tabular-nums}
.w-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%}
.w-row>span{min-width:0}
.w-row .w-kg{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-align:right}
.w-row .w-when{font-weight:600}
.w-row .w-d{font-size:13px;text-align:right;font-variant-numeric:tabular-nums}

/* exames */
.mk-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mk-card{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.mk-card>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mk-card b{font-size:19px;font-variant-numeric:tabular-nums}
.mk-card b small{font-size:12px;color:var(--muted);font-weight:600}
.mk-card .chip{align-self:flex-start}
.spark{width:100%;height:26px;display:block}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.res-table{width:100%;border-collapse:collapse;font-size:15px}
.res-table td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
.res-table tr:first-child td{border-top:0}
.res-table .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.res-table .r{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.linkish{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:650;text-align:left;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{appearance:none;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);aspect-ratio:1;max-width:100%;overflow:hidden;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--muted);font-size:12px;gap:4px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pdf{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;text-align:center;word-break:break-word}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span,.mk-grid label>span,.section-label{font-size:13px;color:var(--muted);font-weight:650}
.section-label{margin-top:4px;text-transform:uppercase;letter-spacing:.07em;font-size:12px}
.input{appearance:none;-webkit-appearance:none;width:100%;min-width:0;font-size:17px;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px}
textarea.input{resize:vertical;line-height:1.35}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type="date"].input{display:block}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.input-row{display:flex;gap:8px}
.kg-field{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:10px 0 4px}
.kg-input{appearance:none;border:0;background:transparent;font-size:56px;font-weight:750;letter-spacing:-.03em;width:5.2ch;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;border-bottom:2px solid var(--line-strong);border-radius:0}
.kg-input:focus{outline:none;border-bottom-color:var(--accent)}
.kg-field b{font-size:24px;color:var(--muted)}
.meta{display:flex;flex-direction:column;gap:10px;background:var(--bg);border-radius:12px;padding:12px}
.meta-row{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.meta-row svg{flex:none;margin-top:2px;color:var(--accent)}
.err{color:var(--bad);font-weight:600;margin:0;font-size:14px}
.mk{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.mk .input{background:var(--surface)}
.mk-top{display:flex;gap:6px;align-items:center}
.mk-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px}
.mk-grid label{display:flex;flex-direction:column;gap:4px;min-width:0}
.mk-grid .input{padding:9px 8px;font-size:16px}
.markers{display:flex;flex-direction:column;gap:10px}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:4px 4px 4px 10px;font-size:14px}
.files li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 9px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.kinds button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.edit-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.edit-list li{display:flex;gap:4px;align-items:center}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:15px}
.dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.5) blur(18px);backdrop-filter:saturate(1.5) blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom, 0px))}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:var(--muted);padding:4px 0;cursor:pointer;min-height:48px;border-radius:10px}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* sheet */
#sheet-root,#confirm-root,#viewer-root{position:fixed;inset:0;z-index:40}
#confirm-root{z-index:60} #viewer-root{z-index:70}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .18s ease}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);margin:0 auto;max-width:560px;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:calc(var(--vvh,100vh) - env(safe-area-inset-top, 0px) - 18px);display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px 10px 6px 18px}
.sheet-head h2{flex:1}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(20px + env(safe-area-inset-bottom, 0px));overscroll-behavior:contain}
.confirm{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:380px;margin:0 auto;background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.confirm p{margin:0;font-size:16px}
.confirm .row>*{flex:1}
.viewer{position:absolute;inset:0;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 50px) 12px calc(env(safe-area-inset-bottom,0px) + 20px);background:rgba(0,0,0,.92)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.viewer .icon-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;color:#fff;background:rgba(255,255,255,.14)}
#toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 14px);transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);font-weight:650;font-size:15px;padding:10px 16px;border-radius:12px;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.mk-grid{grid-template-columns:1fr 1fr}.big-num{font-size:44px}.dots i{width:6px;height:6px}}

/* v2: gamificação, saúde, diário */
.row.between{justify-content:space-between}
.lvl-card{appearance:none;width:100%;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;color:inherit}
.lvl-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.lvl-main .l-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lvl-main .l-top b{font-size:16px}
.lvl-name{color:var(--gold);font-weight:750}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--gold))}
.l-stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.l-stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.energy{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.energy button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;min-height:40px;font-weight:700;font-size:15px;color:var(--muted);padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.energy button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.energy-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.xp-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:2px 8px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface);min-width:0}
.badge .b-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.badge.got .b-ico{background:var(--gold-soft);color:var(--gold)}
.badge:not(.got){opacity:.6}
.badge b{font-size:13px;line-height:1.2}
.badge span{font-size:11.5px;color:var(--muted);line-height:1.25}
.missions{display:flex;flex-direction:column;gap:14px}
.mission{display:flex;flex-direction:column;gap:6px}
.mission .m-top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.mission.done .bar i{background:var(--ok)}
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.insights li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;font-size:15px}
.insights li b{font-variant-numeric:tabular-nums}
.big-level{display:flex;align-items:center;gap:16px}
.big-level .lv{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),var(--gold));flex:none}
.tabs-sub{margin-top:-4px}
.fx{display:flex;flex-direction:column;gap:12px}
.ficha-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ficha-top .card{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ficha-top b{font-size:20px}
.tabbar .in{grid-template-columns:repeat(5,1fr)}
.tabbar button{font-size:10.5px}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll button{appearance:none;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 13px;font-weight:650;font-size:14px;cursor:pointer;white-space:nowrap}
.chips-scroll button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.res-list{display:flex;flex-direction:column;gap:10px}
.res-card{appearance:none;width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:inherit;padding:14px 14px 8px}
.rc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rc-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.rc-val{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;text-align:right}
.rc-val b{font-size:20px}
.rc-delta{font-size:13px;font-weight:650}
.rc-delta.good{color:var(--ok)} .rc-delta.bad{color:var(--bad)} .rc-delta.muted{color:var(--muted);font-weight:500}
.pdfv{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column}
.pdfv-bar{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--surface);border-bottom:1px solid var(--line)}
.pdfv-name{flex:1;min-width:0;font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdfv-pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:8px;align-items:center}
.pdfv-pages canvas{width:100%;max-width:900px;height:auto;background:#fff;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pdfv-frame{width:100%;flex:1;min-height:70vh;border:0;background:#fff}

/* v3: cofre e bloqueio */
#lock-root{position:fixed;inset:0;z-index:55}
.lock{position:absolute;inset:0;background:var(--bg);display:grid;place-items:center;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.lock-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
.lock-box h1{font-size:26px}
.lock-box p{margin:0}
.lock-ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin:0 auto;color:#fff;background:linear-gradient(135deg,var(--accent),var(--gold))}
.lock-input{text-align:center;font-size:24px;letter-spacing:.25em}
[data-vault-status].bad{color:var(--bad);font-weight:650}
.confirm b{font-size:17px}
.confirm .input{background:var(--bg)}
details summary{cursor:pointer;color:var(--accent);font-weight:650}

/* v3.2: tela inicial, personalizar */
.home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hh-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.hh-txt h1{font-size:27px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;color:var(--ink);min-height:64px;min-width:0}
.qa button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qa-ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.qa-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.qa-t b{font-size:15px;line-height:1.2}
.qa-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-title h2{font-size:19px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;font-size:15px}
.set-row+.set-row{border-top:1px solid var(--line)}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line-strong);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(20px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chart .goal{stroke:var(--gold);stroke-width:1.5;stroke-dasharray:5 4}
.chart .goal-lbl{fill:var(--gold);font-size:10.5px;font-weight:700}
.single-list{padding:0;overflow:hidden}
.single-list .sl-head{padding:12px 14px 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650}
.single-list ul{list-style:none;margin:0;padding:0}
.single-list li{border-top:1px solid var(--line)}
.single-list .rc-val b{font-size:17px}
.chip.k-note{background:var(--surface-2);color:var(--muted)}
@media (max-width:360px){.qa{grid-template-columns:1fr}}

/* v3.3: hábitos por horário, próximo hábito, peso rápido, pacote do Claude */
.per-head{display:flex;align-items:center;gap:8px;margin:4px 2px -4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.per-head b{color:var(--ink);font-weight:750}
.per-head .chip{text-transform:none;letter-spacing:0}
.done-box{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.done-box summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;font-weight:650;color:var(--muted);min-height:48px}
.done-box summary::-webkit-details-marker{display:none}
.done-box[open] summary svg{transform:rotate(180deg)}
.done-box .list{border:0;border-top:1px solid var(--line);border-radius:0}
.all-done{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--radius);background:var(--ok-soft,var(--accent-soft));color:var(--ok)}
.next-card{appearance:none;width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;cursor:pointer;color:inherit;border:1.5px solid var(--accent)}
.nc-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.nc-txt b{font-size:18px;line-height:1.25}
.nc-btn{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:12px 16px;font-weight:750;font-size:16px}
.kg-step{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kg-step .btn{min-width:96px;min-height:52px;font-size:19px;font-weight:750}
.ed-main{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.per-sel{padding-top:8px;padding-bottom:8px;min-height:40px;font-size:16px}
.edit-list li{align-items:flex-start}
.tip-box{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);background:var(--accent-soft);color:var(--ink)}
.tip-box>svg{color:var(--accent);flex:none;margin-top:2px}
.lock .btn.primary{min-height:52px}

  if (s == null) return NaN;

  if (!t) return NaN;
  if (t.includes(',') && t.includes('.')) t = t.replace(/\./g, '').replace(',', '.');
  else if (t.includes(',')) t = t.replace(',', '.');

const KINDS = [['casa', 'Casa'], ['saude', 'Saúde'], ['academia', 'Academia'], ['trabalho', 'Trabalho'], ['outro', 'Outro']];

/* ---------- presets ---------- */
const PRESETS = [

/* ---------- storage (IndexedDB, fallback localStorage) ---------- */
const Store = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const r = indexedDB.open('prontuario', 1);
      r.onupgradeneeded = () => { const db = r.result; ['kv', 'files'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); }); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async run(store, mode, fn) {

    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const req = fn(t.objectStore(store)); let out;
      if (req) req.onsuccess = () => { out = req.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(s, k) { return this.run(s, 'readonly', o => o.get(k)); },
  put(s, k, v) { return this.run(s, 'readwrite', o => o.put(v, k)); },
  del(s, k) { return this.run(s, 'readwrite', o => o.delete(k)); },
  keys(s) { return this.run(s, 'readonly', o => o.getAllKeys()); },
  clear(s) { return this.run(s, 'readwrite', o => o.clear()); }
};

      e => rej(e), { enableHighAccuracy: true, timeout, maximumAge: 20000 });

}

  if (c === 2) return 'Não deu pra achar sua posição agora.';
  if (c === 3) return 'Demorou demais pra achar o GPS.';
  if (c === 'insecure') return 'A localização só funciona com o app aberto por https.';

}

}

/* ---------- chart ---------- */
function niceStep(range, count) {
  const raw = range / count, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function lineChart(pts, { refMin = null, refMax = null, h = 190, dec = 1, area = true, goal = null } = {}) {
  if (pts.length < 2) return `<p class="muted small">Com 2 registros ou mais aparece o gráfico aqui.</p>`;
  const W = 360, H = h, L = 38, R = 48, T = 16, B = 24;
  const ys = pts.map(p => p.v);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (refMin != null && refMin < lo && lo - refMin < (hi - lo || 1) * 2) lo = refMin;
  if (refMax != null && refMax > hi && refMax - hi < (hi - lo || 1) * 2) hi = refMax;
  if (goal != null && Math.abs(goal - (lo + hi) / 2) < Math.max(hi - lo, 2) * 3) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  if (hi - lo < 1e-9) { lo -= Math.max(1, Math.abs(lo) * 0.02); hi += Math.max(1, Math.abs(hi) * 0.02); }
  const step = niceStep(hi - lo, 4);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const tdec = step < 0.1 ? 2 : step < 1 ? 1 : 0;
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t;
  const sx = t => L + (t1 === t0 ? 0.5 : (t - t0) / (t1 - t0)) * (W - L - R);
  const sy = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  if (refMin != null || refMax != null) {
    const a = sy(Math.min(hi, refMax != null ? refMax : hi)), b = sy(Math.max(lo, refMin != null ? refMin : lo));
    if (b > a) g += `<rect class="band" x="${L}" y="${a.toFixed(1)}" width="${W - L - R}" height="${(b - a).toFixed(1)}"/>`;
  }
  for (let v = lo; v <= hi + step / 2; v += step) {
    const y = sy(v).toFixed(1);
    g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 6}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end">${fmtNum(v, tdec)}</text>`;
  }
  const spanDays = (t1 - t0) / 864e5;
  const xl = t => spanDays > 330 ? new Date(t).toLocaleDateString('pt-BR', { month: 'short', year: '2-digit' }).replace('. de ', '/').replace(' de ', '/') : fmtShort(t);
  g += `<text class="axis" x="${L}" y="${H - 6}" text-anchor="start">${xl(t0)}</text><text class="axis" x="${W - R}" y="${H - 6}" text-anchor="end">${xl(t1)}</text>`;
  if (spanDays > 6) g += `<text class="axis" x="${((L + W - R) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${xl((t0 + t1) / 2)}</text>`;
  if (goal != null && goal >= lo && goal <= hi) { const gy = sy(goal).toFixed(1); g += `<line class="goal" x1="${L}" x2="${W - R}" y1="${gy}" y2="${gy}"/><text class="goal-lbl" x="${W - R + 4}" y="${(+gy + 3.5).toFixed(1)}">meta</text>`; }
  const xy = pts.map(p => [sx(p.t), sy(p.v)]);
  const d = xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  if (area) g += `<path class="area" d="${d}L${xy[xy.length - 1][0].toFixed(1)} ${H - B}L${xy[0][0].toFixed(1)} ${H - B}Z"/>`;
  g += `<path class="line" d="${d}"/>`;
  if (pts.length <= 45) g += xy.slice(0, -1).map(p => `<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3"/>`).join('');
  const e = xy[xy.length - 1];
  g += `<circle class="end" cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="5"/><text class="end-lbl" x="${(e[0] + 9).toFixed(1)}" y="${(e[1] + 4).toFixed(1)}" text-anchor="start">${fmtNum(pts[pts.length - 1].v, dec)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de evolução">${g}</svg>`;
}
function spark(pts) {
  if (pts.length < 2) return '<svg class="spark" viewBox="0 0 100 26" aria-hidden="true"></svg>';
  const ys = pts.map(p => p.v), lo = Math.min(...ys), hi = Math.max(...ys), t0 = pts[0].t, t1 = pts[pts.length - 1].t;

    { id: 'm-energy', name: `Registre a energia em ${M.energy} ${M.energy === 1 ? 'dia' : 'dias'}`, got: Math.min(eDays, M.energy), goal: M.energy, icon: 'bolt' }

function energyInsights() {
  const keys = [['banho', 'Banho gelado'], ['sol', 'Sol pela manhã'], ['cama', 'Cama só à noite'], ['nofap', 'NoFap'], ['movimento', 'Movimento'], ['acordar', 'Acordou cedo'], ['dormir', 'Dormiu cedo']];
  const out = [];
  for (const [k, label] of keys) {
    const t = taskByKey(k); if (!t) continue;
    const yes = [], no = [];
    for (const [d, j] of Object.entries(S.journal)) { if (!j || j.energy == null) continue; (isDone(d, t.id) ? yes : no).push(j.energy); }
    if (yes.length >= 3 && no.length >= 3) { const avg = a => a.reduce((s, x) => s + x, 0) / a.length; out.push({ label: t.name, yes: avg(yes), no: avg(no) }); }
  }
  return out.sort((a, b) => (b.yes - b.no) - (a.yes - a.no));
}

/* ---------- peso ---------- */
let weighing = null;
function openWeigh() {
  closeSheet();
  weighing = { onUpdate: () => { const el = $('#weigh-loc'); if (el) el.innerHTML = weighLocHtml(); } };
  startLocating(weighing);
  openSheet('Registrar peso', weighBody, () => { const i = $('#kg-input'); if (i && !weightsDesc()[0]) i.focus(); });
  sheetCleanup = () => { weighing = null; };
}
function weighLocHtml() {
  const w = weighing;
  if (!w || w.status === 'locating') return `${ico('locate', 17)}<span class="muted">Pegando sua localização…</span>`;
  if (w.status === 'error') return `${ico('semloc', 17)}<span class="muted">${esc(w.error)}<br>O peso será salvo mesmo assim.</span>`;
  const p = placeOf({ loc: w.loc, placeId: w.placeId, label: w.label, address: w.address, kind: w.kind, locStatus: 'ok' });
  const extra = w.status === 'located' ? ' · buscando endereço…' : (p.sub ? ' · ' + p.sub : '');
  return `${ico(p.kind === 'locate' ? 'outro' : p.kind, 17)}<span><b>${esc(p.name)}</b><span class="muted">${esc(extra)}</span><br><span class="muted small">precisão de ± ${w.loc.acc} m</span></span>`;
}
function weighBody() {
  const last = weightsDesc()[0], now = new Date();
  return `<form data-form="weigh" class="stack" autocomplete="off">
    <label class="kg-field" for="kg-input"><span class="vh">Peso em quilos</span><input id="kg-input" class="kg-input" inputmode="decimal" enterkeyhint="done" placeholder="0,0" value="${last ? fmtKg(last.kg) : ''}"><b>kg</b></label>
    ${last ? `<div class="kg-step"><button type="button" class="btn" data-act="kg-step" data-d="-0.1" aria-label="Diminuir 100 gramas">−0,1</button><span class="muted small">último: ${fmtKg(last.kg)} kg</span><button type="button" class="btn" data-act="kg-step" data-d="0.1" aria-label="Aumentar 100 gramas">+0,1</button></div>` : ''}
    <div class="meta">
      <div class="meta-row">${ico('cal', 17)}<span>${esc(fmtDayLong(dayKey(now)))} · ${fmtTime(now)}</span></div>
      <div class="meta-row" id="weigh-loc">${weighLocHtml()}</div>
    </div>
    <details class="small"><summary>Registrar peso de outro dia (anotado)</summary><label class="field" style="margin-top:8px"><span>Data</span><input id="kg-date" class="input" type="date" max="${dayKey()}"></label><span class="muted">Fica sem hora e sem local.</span></details>
    <p class="err" id="weigh-err" hidden></p>
    <button class="btn primary block" type="submit">Salvar peso</button>
  </form>`;
}
function applyLoc(entry, w) {
  if (w.loc) { entry.loc = w.loc; entry.placeId = w.placeId || null; entry.label = w.label || null; entry.address = w.address || null; entry.kind = w.kind || null; }
  entry.locStatus = w.status === 'error' ? 'none' : (w.loc ? 'ok' : 'pending');
  if (w.status === 'error') entry.locError = w.error;
}
async function saveWeigh() {
  const kg = parseNum($('#kg-input').value), err = $('#weigh-err');
  if (!(kg >= 20 && kg <= 350)) { err.textContent = 'Digite o peso em kg, por exemplo 82,4.'; err.hidden = false; return; }
  const w = weighing, before = computeGame();
  const dsel = $('#kg-date') ? $('#kg-date').value : '';
  const past = dsel && dsel < dayKey();
  const entry = { id: uid(), kg: Math.round(kg * 10) / 10, ts: past ? new Date(dsel + 'T12:00:00').toISOString() : new Date().toISOString(), loc: null, placeId: null, label: null, address: null, kind: null, locStatus: past ? 'none' : 'pending' };
  if (past) { entry.timeUnknown = true; entry.source = 'anotação'; } else applyLoc(entry, w);
  S.weights.push(entry); await save();
  if (!past && w && w.status !== 'ok' && w.status !== 'error') w.promise.then(() => finishLoc(entry.id, w), () => finishLoc(entry.id, w));
  closeSheet(); render(); xpToast(before, `Peso salvo: ${fmtKg(entry.kg)} kg`);
}
async function finishLoc(id, w) { const e = S.weights.find(x => x.id === id); if (!e) return; applyLoc(e, w); await save(); render(); }
const whenTxt = w => w.timeUnknown ? `${fmtDate(w.ts)} (sem hora)` : `${fmtDate(w.ts)} às ${fmtTime(w.ts)}`;
function goalTxt(last) {
  const g = S.settings.weightGoal;
  if (g == null) return `<button class="linkish" style="font-size:14px" data-act="customize">${ico('target', 15)} Definir meta de peso</button>`;
  const diff = Math.round((g - last.kg) * 10) / 10;
  return `<span class="small" style="color:var(--gold);font-weight:650">${ico('target', 15)} ${Math.abs(diff) < 0.05 ? `Na meta (${fmtKg(g)} kg)` : `Faltam ${fmtKg(Math.abs(diff))} kg pra meta de ${fmtKg(g)} kg`}</span>`;
}
function viewPeso() {
  const ws = weightsDesc(), last = ws[0], prev = ws[1];
  let hero;
  if (last) {
    const d = prev ? Math.round((last.kg - prev.kg) * 10) / 10 : null;
    const dCls = d == null ? '' : d > 0 ? 'up' : d < 0 ? 'down' : 'eq';
    hero = `<section class="card hero-w"><span class="eyebrow">Último registro</span>
      <div class="big-num">${fmtKg(last.kg)}<small>kg</small></div>
      ${d != null ? `<span class="delta ${dCls}">${d > 0 ? '+' : d < 0 ? '−' : '±'}${fmtKg(Math.abs(d))} kg <span class="muted" style="font-weight:500">desde ${fmtShort(prev.ts)}</span></span>` : ''}
      <div class="row"><span class="muted small">${whenTxt(last)}</span>${placeChip(last)}</div>
      ${goalTxt(last)}</section>`;
  } else hero = `<div class="empty"><b>Nenhum peso registrado</b>Cada registro guarda data, hora e o local onde você está.</div>`;
  const now = Date.now(), inRange = (w, n) => !n || now - Date.parse(w.ts) <= n * 864e5;
  // sem escolha manual: o menor período que mostre pelo menos 6 pesagens; senão, tudo (histórico antigo sempre aparece)
  const rng = UI.range || (['30', '90', '365'].find(v => ws.filter(w => inRange(w, +v)).length >= 6) || 'all');
  const days = { '30': 30, '90': 90, '365': 365 }[rng];
  const pts = ws.filter(w => inRange(w, days)).map(w => ({ t: Date.parse(w.ts), v: w.kg })).reverse();
  let stats = '';
  if (pts.length >= 2) {
    const vs = pts.map(p => p.v), ch = Math.round((vs[vs.length - 1] - vs[0]) * 10) / 10;
    stats = `<div class="stats"><div><span class="muted small">Variação</span><b>${ch > 0 ? '+' : ch < 0 ? '−' : ''}${fmtKg(Math.abs(ch))} kg</b></div><div><span class="muted small">Mínimo</span><b>${fmtKg(Math.min(...vs))}</b></div><div><span class="muted small">Máximo</span><b>${fmtKg(Math.max(...vs))}</b></div></div>`;
  }
  const seg = [['30', '30 dias'], ['90', '90 dias'], ['365', '1 ano'], ['all', 'Tudo']].map(([v, n]) => `<button data-act="range" data-v="${v}" aria-pressed="${rng === v}">${n}</button>`).join('');
  return `<header class="page-head"><h1>Peso</h1><button class="btn primary" data-act="weigh">${ico('plus', 18, 2.2)} Registrar</button></header>
  ${hero}
  ${ws.length ? `<section class="card stack"><div class="seg" role="group" aria-label="Período">${seg}</div>${lineChart(pts, { goal: S.settings.weightGoal })}${stats}</section>
  <h2 class="sec">Histórico</h2>
  <ul class="list">${ws.map((w, i) => { const pv = ws[i + 1]; const d = pv ? Math.round((w.kg - pv.kg) * 10) / 10 : null;
    return `<li><button class="row-btn" data-act="weight-open" data-id="${w.id}"><div class="w-row">
      <span class="w-when">${fmtDate(w.ts)}${w.timeUnknown ? '' : ` <span class="muted" style="font-weight:500">· ${fmtTime(w.ts)}</span>`}</span><span class="w-kg">${fmtKg(w.kg)} kg</span>
      <span>${placeChip(w)}</span><span class="w-d ${d == null ? 'muted' : d > 0 ? 'delta up' : d < 0 ? 'delta down' : 'delta eq'}">${d == null ? '' : (d > 0 ? '+' : d < 0 ? '−' : '±') + fmtKg(Math.abs(d))}</span>
    </div></button></li>`; }).join('')}</ul>` : ''}`;
}
let weightEditId = null;

/* ---------- saúde: exames, consultas, ficha ---------- */
function mkStatus(m) {
  if (m.num == null || isNaN(m.num)) return null;
  if (m.refMin != null && m.num < m.refMin) return 'baixo';
  if (m.refMax != null && m.num > m.refMax) return 'alto';
  if (m.refMin != null || m.refMax != null) return 'normal';
  return null;
}
const statusChip = s => s === 'alto' ? '<span class="chip bad">Alto</span>' : s === 'baixo' ? '<span class="chip low">Baixo</span>' : s === 'normal' ? '<span class="chip ok">Normal</span>' : '';
const refText = m => m.refText ? 'ref. ' + m.refText : m.refMin != null && m.refMax != null ? `ref. ${fmtNum(m.refMin)}–${fmtNum(m.refMax)}` : m.refMin != null ? `ref. ≥ ${fmtNum(m.refMin)}` : m.refMax != null ? `ref. ≤ ${fmtNum(m.refMax)}` : '';
const mkKey = n => String(n).trim().toLowerCase();
function markerIndex() {
  const map = new Map();
  const exs = [...S.exams].sort((a, b) => a.date.localeCompare(b.date));
  for (const e of exs) for (const m of e.markers) {
    if (!m.name) continue; const k = mkKey(m.name);
    if (!map.has(k)) map.set(k, { key: k, name: m.name, unit: m.unit, pts: [], rows: [] });
    const it = map.get(k); it.name = m.name; if (m.unit) it.unit = m.unit;
    it.rows.push({ date: e.date, examId: e.id, m });
    if (m.num != null && !isNaN(m.num)) it.pts.push({ t: parseDay(e.date).getTime(), v: m.num });
    it.last = m;
  }
  return [...map.values()].filter(x => x.pts.length).sort((a, b) => (b.pts.length - a.pts.length) || a.name.localeCompare(b.name, 'pt-BR'));
}
const outCount = e => e.markers.filter(m => { const s = mkStatus(m); return s === 'alto' || s === 'baixo'; }).length;
function viewSaude() {
  const seg = [['exames', 'Exames'], ['consultas', 'Consultas'], ['ficha', 'Ficha']].map(([v, n]) => `<button data-act="sub" data-v="${v}" aria-pressed="${UI.sub === v}">${n}</button>`).join('');
  const btn = UI.sub === 'exames' ? `<button class="btn primary" data-act="exam-new">${ico('plus', 18, 2.2)} Exame</button>` : UI.sub === 'consultas' ? `<button class="btn primary" data-act="consult-new">${ico('plus', 18, 2.2)} Consulta</button>` : '';
  let body = '';
  if (UI.sub === 'exames') {
    const ex = [...S.exams].sort((a, b) => b.date.localeCompare(a.date) || (b.created || '').localeCompare(a.created || ''));
    const idx = markerIndex();
    body = `${ex.length ? `<ul class="list">${ex.map(e => { const out = outCount(e);
      return `<li><button class="row-btn" data-act="exam-open" data-id="${e.id}"><div class="rb-main"><b>${esc(e.title || 'Exame')}</b><span class="muted small">${fmtDK(e.date)}${e.lab ? ' · ' + esc(e.lab) : ''} · ${plural(e.markers.length, 'resultado', 'resultados')}</span>${out ? `<span class="chip bad" style="align-self:flex-start;margin-top:4px">${out} fora da referência</span>` : ''}</div>
        <div class="rb-side">${(e.files || []).length ? ico('file', 16) : ''}${ico('next', 16)}</div></button></li>`; }).join('')}</ul>`
      : `<div class="empty"><b>Nenhum exame ainda</b>Toque em Exame pra lançar os resultados e anexar a foto ou o PDF do laudo.</div>`}
    ${idx.length ? `<button class="quick" data-act="tab" data-tab="resultados"><span class="q-ico">${ico('bolt', 20)}</span><span class="q-txt"><b>Gráficos de cada resultado</b><span class="muted small">Vitamina D, glicemia, colesterol, hemograma… na aba Resultados</span></span>${ico('next', 18)}</button>` : ''}`;
  } else if (UI.sub === 'consultas') {
    const cs = [...S.consults].sort((a, b) => b.date.localeCompare(a.date));
    body = cs.length ? `<ul class="list">${cs.map(c => `<li><button class="row-btn" data-act="consult-open" data-id="${c.id}"><div class="rb-main"><b>${esc(c.specialty || 'Consulta')}</b><span class="muted small">${fmtDK(c.date)}${c.doctor ? ' · ' + esc(c.doctor) : ''}${c.place ? ' · ' + esc(c.place) : ''}</span>${c.returnDate && c.returnDate >= dayKey() ? `<span class="chip k-casa" style="align-self:flex-start;margin-top:4px">${ico('cal', 13, 2)}<span>Retorno ${fmtDK(c.returnDate)}</span></span>` : ''}</div><div class="rb-side">${(c.files || []).length ? ico('file', 16) : ''}${ico('next', 16)}</div></button></li>`).join('')}</ul>`
      : `<div class="empty"><b>Nenhuma consulta ainda</b>Registre médico, motivo, o que foi orientado e a data do retorno. O retorno aparece na tela Hoje.</div>`;
  } else {
    const p = S.profile;
    const f = (id, key, label, ph, rows) => rows ? `<label class="field"><span>${label}</span><textarea id="pf-${id}" class="input" rows="${rows}" data-pf="${key}" placeholder="${esc(ph)}">${esc(p[key])}</textarea></label>` : `<label class="field"><span>${label}</span><input id="pf-${id}" class="input" data-pf="${key}" value="${esc(p[key])}" placeholder="${esc(ph)}"></label>`;
    body = `<div class="ficha-top"><div class="card"><span class="muted small">${ico('drop', 14)} Tipo sanguíneo</span><b>${esc(p.blood || '—')}</b></div><div class="card"><span class="muted small">${ico('eye', 14)} Visão</span><b style="font-size:15px">${esc(p.vision || '—')}</b></div></div>
    <section class="card stack">${f('blood', 'blood', 'Tipo sanguíneo', 'Ex.: O negativo')}${f('vision', 'vision', 'Visão / óculos', 'Ex.: miopia -1,50')}${f('allergies', 'allergies', 'Alergias', 'Nenhuma conhecida')}${f('meds', 'meds', 'Remédios e suplementos em uso', 'Ex.: vitamina D 2.000 UI', 2)}${f('conditions', 'conditions', 'Condições e observações', '', 3)}${f('emergency', 'emergency', 'Contato de emergência', 'Nome e telefone')}</section>
    <p class="muted small">Salva sozinho enquanto você digita. Útil pra mostrar num atendimento de emergência.</p>`;
  }
  return `<header class="page-head"><h1>Saúde</h1>${btn}</header><div class="seg tabs-sub" role="group" aria-label="Seção">${seg}</div>${body}`;
}

async function compressImage(file) {

  } catch (_) { return file; }
}

const CATS = [
  ['vitaminas', 'Vitaminas e minerais', /vitamina|b12|ferritina|ferro|magn[eé]sio|c[aá]lcio|zinco|f[oó]lico|s[oó]dio|pot[aá]ssio/],
  ['glicemia', 'Glicemia', /(^|\s)glic|glicada|hba1c|insulina/],
  ['hemograma', 'Hemograma', /^(hem[aá]cias|hemoglobina|hemat[oó]crito|vcm|hcm|chcm|rdw|leuc[oó]citos|segmentados|bastonetes|eosin|bas[oó]filos|linf[oó]citos|mon[oó]citos|plaquetas)/],
  ['colesterol', 'Colesterol e triglicerídeos', /colesterol|hdl|ldl|vldl|triglic/],
  ['rins', 'Rins', /creatinina|ureia|[aá]cido [uú]rico|filtra[cç]/],
  ['figado', 'Fígado', /tgo|tgp|gama|ggt|bilirrubina|fosfatase/],
  ['tireoide', 'Tireoide', /tsh|t4|t3/],
  ['hormonios', 'Hormônios', /testosterona|estradiol|cortisol|psa|prolactina/],
  ['urina', 'Urina', /urina/],
  ['visao', 'Visão', /grau|autorrefrator/],
  ['outros', 'Outros', /.*/]

function catOf(name) { const n = mkKey(name); if (/eletroforese/.test(n)) return 'outros'; if (/urina/.test(n)) return 'urina'; if (/grau|autorrefrator/.test(n)) return 'visao'; for (const [id, , re] of CATS) if (re.test(n)) return id; return 'outros'; }

function miniChart(it) {
  const pts = it.pts.slice(-6), last = it.last;
  const W = 340, H = pts.length === 1 ? 78 : 112, L = 14, R = 14, T = 22, B = 24;
  const ys = pts.map(p => p.v); let lo = Math.min(...ys), hi = Math.max(...ys);

  const pad = ((hi - lo) || span0) * 0.18; lo -= pad; hi += pad;

  const sy = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

    const a = sy(Math.min(hi, last.refMax != null ? last.refMax : hi)), b = sy(Math.max(lo, last.refMin != null ? last.refMin : lo));
    if (b > a) g += `<rect class="band" x="${L}" y="${a.toFixed(1)}" width="${W - L - R}" height="${(b - a).toFixed(1)}" rx="4"/>`;
  }
  g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  const xy = pts.map((p, i) => [sx(i), sy(p.v)]);
  if (pts.length > 1) g += `<path class="line" d="${xy.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('')}"/>`;

  xy.forEach((p, i) => {
    const isLast = i === xy.length - 1;

    g += `<text class="${isLast ? 'end-lbl' : 'axis'}" x="${p[0].toFixed(1)}" y="${(p[1] - 10).toFixed(1)}" text-anchor="middle" style="font-weight:700">${fmtNum(pts[i].v, dec)}</text>`;

function deltaHtml(it) {

    }
    const n = document.createElement('p'); n.className = 'muted small center'; n.textContent = `${plural(doc.numPages, 'página', 'páginas')} · pinça pra dar zoom`; box.appendChild(n);
  } catch (e) {
    const u = URL.createObjectURL(f.blob); root._url = u;

const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); });
function b64ToBuf(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }
async function shareOrDownload(file, title) {

  }
  const u = URL.createObjectURL(file); const a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000);
  return true;
}
async function exportBackup() {

  const now = new Date().toISOString(), before = computeGame();
  const payload = { app: APP_ID, v: 2, exportedAt: now, state: { ...S, meta: { ...S.meta, lastBackup: now, backupLog: [...(S.meta.backupLog || []), now] } }, files };
  let out = payload, fname = `prontuario-backup-${dayKey()}.json`;
  if (Vault.key && Vault.cfg) { out = { app: APP_ID, kind: 'backup-enc', v: 3, exportedAt: now, kdf: { name: 'PBKDF2-SHA256', iter: Vault.cfg.iter, salt: Vault.cfg.salt }, data: b64(await encBytes(Vault.key, TE.encode(JSON.stringify(payload)))) }; fname = `prontuario-backup-${dayKey()}-criptografado.json`; }
  const ok = await shareOrDownload(new File([JSON.stringify(out)], fname, { type: 'application/json' }), 'Backup do Prontuário');
  if (!ok) return;

}
async function exportCsv() {

  const days = [...new Set([...Object.keys(S.checks), ...Object.keys(S.journal)])].sort();

async function importBackup(file) {
  let p; try { p = JSON.parse(await file.text()); } catch (_) { return toast('Esse arquivo não abriu.'); }
  if (p && p.app === APP_ID && p.kind === 'backup-enc') {
    const pass = await askSecret('Senha do backup', 'Esse backup está criptografado. Digite a senha do cofre usada quando ele foi feito.', { okLabel: 'Abrir' });
    if (!pass) return;
    try { const k = await deriveKey(pass, unb64(p.kdf.salt), p.kdf.iter); p = JSON.parse(TD.decode(await decBytes(k, unb64(p.data)))); } catch (_) { return toast('Senha errada pra esse backup.'); }
  }
  if (p && p.app === APP_ID && p.kind === 'pacote') return importPack(p);
  if (!p || p.app !== APP_ID || !p.state) return toast('Esse arquivo não é um backup do Prontuário.');
  const st = p.state;
  const n = `${plural((st.exams || []).length, 'exame', 'exames')}, ${plural((st.consults || []).length, 'consulta', 'consultas')} e ${plural((st.weights || []).length, 'peso', 'pesos')}`;
  if (!await askConfirm(`O arquivo tem ${n}. Importar substitui tudo o que está neste aparelho agora.`, 'Substituir dados')) return;
  try { await Store.clear('files'); for (const f of p.files || []) await Store.put('files', f.id, { buf: b64ToBuf(f.data), type: f.type, name: f.name }); } catch (_) {}
  S = st; migrate(); await save(); UI.day = dayKey(); render(); toast('Dados importados');
}

/* pacote: exame/consulta/peso preparado pelo Claude — soma ao que já existe, não substitui */
async function importPack(p) {
  const ex = p.exams || [], cs = p.consults || [], ws = p.weights || [];
  const n = [ex.length && plural(ex.length, 'exame', 'exames'), cs.length && plural(cs.length, 'consulta', 'consultas'), ws.length && plural(ws.length, 'peso', 'pesos')].filter(Boolean).join(', ');
  if (!n) return toast('Esse arquivo não tem nada pra adicionar.');
  const has = (arr, it) => arr.some(x => x.id === it.id);
  const upd = ex.filter(e => has(S.exams, e)).length + cs.filter(c => has(S.consults, c)).length + ws.filter(w => has(S.weights, w)).length;
  const title = ex.length === 1 && !cs.length && !ws.length ? `${ex[0].title || 'Exame'} de ${fmtDK(ex[0].date)} (${plural((ex[0].markers || []).length, 'resultado', 'resultados')})` : n;
  if (!await askConfirm(`Adicionar ao app: ${title}?${upd ? ` ${upd === 1 ? 'Um item já existia e vai ser atualizado.' : `${upd} itens já existiam e vão ser atualizados.`}` : ''} O resto dos seus dados não muda.`, 'Adicionar', false)) return;
  const before = computeGame();
  await applyPack(p);
  migrate(); await save(); render(); xpToast(before, `Adicionado: ${n}`);
}
async function applyPack(p) {
  const ex = p.exams || [], cs = p.consults || [], ws = p.weights || [];
  for (const f of p.files || []) { try { await Store.put('files', f.id, { buf: b64ToBuf(f.data), type: f.type, name: f.name }); } catch (_) {} }
  S.meta.deleted ||= {};
  const up = (arr, items) => { for (const it of items) { const i = arr.findIndex(x => x.id === it.id); if (i >= 0) arr[i] = it; else arr.push(it); delete S.meta.deleted[it.id]; } };
  up(S.exams, ex); up(S.consults, cs); up(S.weights, ws);
  return p.label || [ex.length && plural(ex.length, 'exame', 'exames'), cs.length && plural(cs.length, 'consulta', 'consultas'), ws.length && plural(ws.length, 'peso', 'pesos')].filter(Boolean).join(', ');
}

/* caixa de entrada: o Claude tranca um pacote com a chave PÚBLICA (inbox-key.json no cofre);
   só o app, com a chave privada guardada criptografada pela senha do cofre, abre. Depois de juntar, apaga da caixa. */
const Inbox = {
  priv: null, done: [],
  rsa: { name: 'RSA-OAEP', hash: 'SHA-256' },
  async ensureKey(root) {
    if (this.priv) return;
    if (root.some(x => x.name === 'inbox-key.json')) {
      const j = JSON.parse(TD.decode(await GH.raw('inbox-key.json')));
      const privJwk = JSON.parse(TD.decode(await decBytes(Vault.key, unb64(j.privEnc))));
      this.priv = await crypto.subtle.importKey('jwk', privJwk, this.rsa, false, ['decrypt']);
      return;
    }
    const kp = await crypto.subtle.generateKey({ ...this.rsa, modulusLength: 3072, publicExponent: new Uint8Array([1, 0, 1]) }, true, ['encrypt', 'decrypt']);
    const pub = await crypto.subtle.exportKey('jwk', kp.publicKey), privJwk = await crypto.subtle.exportKey('jwk', kp.privateKey);
    const body = { app: APP_ID, kind: 'inbox-key', v: 1, alg: 'RSA-OAEP-256 + A256GCM', created: new Date().toISOString(), device: deviceName(),
      note: 'Chave PÚBLICA da caixa de entrada do app. Com ela só dá pra trancar arquivos pro app; abrir, só o app (a chave privada abaixo está criptografada com a senha do cofre).',
      pub: { kty: pub.kty, n: pub.n, e: pub.e, alg: pub.alg }, privEnc: b64(await encBytes(Vault.key, TE.encode(JSON.stringify(privJwk)))) };
    try { await GH.put('inbox-key.json', TE.encode(JSON.stringify(body, null, 1)), null, 'Caixa de entrada: chave pública'); }
    catch (e) { if (e.code === 'conflict') return this.ensureKey(await GH.list('')); throw e; }
    try { await GH.put('inbox/LEIA.md', TE.encode('# Caixa de entrada do Prontuário\n\nArquivos .json nesta pasta chegam trancados com a chave pública (inbox-key.json). O app abre, junta aos seus dados e apaga daqui sozinho.\n'), null, 'Caixa de entrada'); } catch (_) {}
    this.priv = await crypto.subtle.importKey('jwk', privJwk, this.rsa, false, ['decrypt']);
  },
  async open(env) {
    const raw = await crypto.subtle.decrypt(this.rsa, this.priv, unb64(env.ek));
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return JSON.parse(TD.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, k, unb64(env.data))));
  },
  async process(root) {
    await this.ensureKey(root);
    const items = (await GH.list('inbox')).filter(x => x.type === 'file' && /\.json$/i.test(x.name));
    const labels = [];
    for (const it of items) {
      try {
        const env = JSON.parse(TD.decode(await GH.raw(it.path)));
        const pack = await this.open(env);
        if (pack.app !== APP_ID || pack.kind !== 'pacote') throw new Error('formato');
        labels.push(await applyPack(pack)); this.done.push(it);
      } catch (e) { if (e.code === 'auth') throw e; console.warn('caixa de entrada', it.name, e && e.message); }
    }
    return labels;
  },
  async cleanup() { const d = this.done.splice(0); for (const it of d) { try { await GH.del(it.path, it.sha, 'Caixa de entrada: recebido no app'); } catch (_) {} } }
};

/* ---------- XP feedback ---------- */
function xpToast(before, msg) {
  const after = computeGame(), gain = after.xp - before.xp;
  const newBadges = after.badges.filter(b => b.got && !before.badges.find(x => x.id === b.id && x.got));
  let html = esc(msg);
  if (gain > 0) html += ` <span class="xp-chip">+${gain} XP</span>`;
  if (after.lv.lvl > before.lv.lvl) html = `Subiu pro nível ${after.lv.lvl} · ${esc(after.lv.name)}! <span class="xp-chip">+${gain} XP</span>`;
  else if (newBadges.length) html = `Conquista: ${esc(newBadges[0].name)} <span class="xp-chip">+${gain} XP</span>`;
  toast(html, after.lv.lvl > before.lv.lvl || newBadges.length ? 3600 : 2200);
}


/* ---------- cofre: criptografia + sincronização no GitHub privado ---------- */
const TE = new TextEncoder(), TD = new TextDecoder();
function b64(buf) { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
async function sha256hex(str) { const h = await crypto.subtle.digest('SHA-256', TE.encode(str)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function deriveKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', TE.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function pinHash(pin, salt) {
  const base = await crypto.subtle.importKey('raw', TE.encode(pin), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, base, 256));
}
async function encBytes(key, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function decBytes(key, data) { const u = data instanceof Uint8Array ? data : new Uint8Array(data); return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12))); }
const KDF_ITER = 600000;
const deviceName = () => { const u = navigator.userAgent; return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Macintosh/.test(u) ? 'Mac' : /Windows/.test(u) ? 'PC' : 'navegador'; };

const GH = {
  cfg: null,
  async req(path, opts = {}) {
    const headers = { 'Authorization': 'Bearer ' + this.cfg.token, 'Accept': opts.accept || 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (opts.body) headers['Content-Type'] = 'application/json';
    const r = await fetch('https://api.github.com' + path, { method: opts.method || 'GET', headers, body: opts.body, cache: 'no-store' });
    if (r.status === 401) throw Object.assign(new Error('auth'), { code: 'auth' });
    if (r.status === 403 && r.headers.get('x-ratelimit-remaining') !== '0') throw Object.assign(new Error('auth'), { code: 'auth' });
    return r;
  },
  base() { return '/repos/' + this.cfg.repo; },
  async repoInfo() { const r = await this.req(this.base()); if (r.status === 404) throw Object.assign(new Error('notfound'), { code: 'notfound' }); if (!r.ok) throw new Error('repo ' + r.status); return r.json(); },
  async list(dir) { const r = await this.req(`${this.base()}/contents/${dir}`); if (r.status === 404) return []; if (!r.ok) throw new Error('list ' + r.status); const j = await r.json(); return Array.isArray(j) ? j : []; },
  async raw(path, ref) { const r = await this.req(`${this.base()}/contents/${path}${ref ? '?ref=' + ref : ''}`, { accept: 'application/vnd.github.raw+json' }); if (r.status === 404) return null; if (!r.ok) throw new Error('get ' + r.status); return new Uint8Array(await r.arrayBuffer()); },
  async put(path, bytes, sha, message) {
    const body = { message, content: b64(bytes) }; if (sha) body.sha = sha;
    const r = await this.req(`${this.base()}/contents/${path}`, { method: 'PUT', body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) throw Object.assign(new Error('conflict'), { code: 'conflict' });
    if (!r.ok) throw new Error('put ' + r.status);
    return (await r.json()).content.sha;
  },
  async del(path, sha, message) { const r = await this.req(`${this.base()}/contents/${path}`, { method: 'DELETE', body: JSON.stringify({ message, sha }) }); if (!r.ok && r.status !== 404 && r.status !== 409 && r.status !== 422) throw new Error('del ' + r.status); },
  async commits(path) { const r = await this.req(`${this.base()}/commits?path=${encodeURIComponent(path)}&per_page=40`); if (!r.ok) throw new Error('commits ' + r.status); return r.json(); }

      salt = unb64(d.vault.kdf.salt); iter = d.vault.kdf.iter;

      catch (_) { d.busy = false; d.err = 'Senha errada pra esse cofre.'; return refreshSheet(); }
    } else { salt = crypto.getRandomValues(new Uint8Array(16)); iter = KDF_ITER; key = await deriveKey(pass, salt, iter); }

    Vault.key = key; GH.cfg = Vault.cfg;
    if (remoteState) { S = isVirgin(S) ? remoteState : mergeStates(S, remoteState); migrate(); await save({ silent: true }); }
    await Vault.persist();
    closeSheet(); render(); toast('Cofre conectado. Sincronizando…');
    await Vault.sync();
    toast(Vault.cfg.error ? esc(Vault.cfg.error) : 'Tudo salvo no cofre, criptografado');
  } catch (e) { d.busy = false; d.err = 'Deu erro ao configurar: ' + (e.message || e); refreshSheet(); }
}

const Upd = { info: null, lastCheck: 0, busy: false };
const verNum = v => String(v || '0').split('.').map(n => parseInt(n, 10) || 0);
function isNewer(a, b) { const x = verNum(a), y = verNum(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0); } return false; }
async function checkUpdate(manual) {
  if (PREVIEW || !navigator.onLine) { if (manual) toast('Sem internet agora.'); return; }
  Upd.lastCheck = Date.now();
  try {
    const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    if (isNewer(j.version, APP_VERSION)) {
      Upd.info = j; if (UI.tab === 'hoje' || UI.tab === 'ajustes') render(); if (manual) toast(`Versão ${esc(j.version)} disponível`);
      // sozinho: atualiza quando não tem nada aberto (no máximo 1 tentativa a cada 10 min por versão)
      let tried = 0; try { tried = +sessionStorage.getItem('upd-' + j.version) || 0; } catch (_) {}
      if (!manual && Date.now() - tried > 600000) autoUpdate(j.version);
    }
    else { Upd.info = null; if (manual) toast(`Você já está na versão mais nova (${APP_VERSION})`); }
  } catch (_) { if (manual) toast('Não consegui verificar agora.'); }
}
function autoUpdate(ver, n = 0) {
  if (sheetRender || Vault.locked || Vault.running || Upd.busy) { if (n < 40) setTimeout(() => autoUpdate(ver, n + 1), 3000); return; }
  try { sessionStorage.setItem('upd-' + ver, String(Date.now())); } catch (_) {}
  applyUpdate();
}
async function applyUpdate() {

  try {
    if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { try { await reg.update(); } catch (_) {} if (reg.waiting) reg.waiting.postMessage('skip'); } }
    if (window.caches) { for (const k of await caches.keys()) await caches.delete(k); }
  } catch (_) {}
  location.reload();
}

  if (t.dataset.jr) { await save(); render(); }
  if (t.dataset.stm) { S.settings.missions[t.dataset.stm] = +t.value; await save(); render(); }
  if (t.dataset.stb) { S.settings[t.dataset.stb] = t.checked; await save(); render(); }
  if (t.id === 'fd-files' && FD) { FD.newFiles.push(...t.files); refreshSheet(); }
  if (t.id === 'import-file' && t.files[0]) { await importBackup(t.files[0]); t.value = ''; }
  if (t.id === 'pack-file' && t.files[0]) { const f = t.files[0]; closeSheet(); await importBackup(f); }
  if (t.dataset.taskPeriod) { const tk = S.tasks.find(x => x.id === t.dataset.taskPeriod); if (tk) { tk.period = t.value; await save(); render(); } }
  if (t.dataset.lockgrace != null && t.id === 'lock-grace') { Lock.cfg.graceMin = +t.value; await Lock.persist(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#viewer-root').hidden) actions['viewer-close'](); else closeSheet(); } });
if (window.visualViewport) { visualViewport.addEventListener('resize', syncViewport); visualViewport.addEventListener('scroll', syncViewport); }
window.addEventListener('online', () => { resolveMissingLabels(); Vault.schedule(500); });
window.addEventListener('pagehide', () => { if (!Vault.locked) Lock.touch(); });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('[data-done-box]')) UI.showDone = e.target.open; }, true);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Vault.hiddenAt = Date.now(); if (!Vault.locked) Lock.touch(); return; }
  if (!Vault.locked && Lock.active() && Vault.hiddenAt && Date.now() - Vault.hiddenAt > Math.max(Lock.cfg.graceMin * 60000, 15000)) showLock(Lock.cfg.mode);
  if (UI.tab === 'hoje' && UI.day !== dayKey() && !sheetRender) { UI.day = dayKey(); render(); }
  if (Vault.cfg && Date.now() - Date.parse(Vault.cfg.lastSync || 0) > 60000) Vault.schedule(600);
  if (Date.now() - Upd.lastCheck > 30 * 60000) checkUpdate(false);
});

/* ---------- boot ---------- */
(async function boot() {
  syncViewport();
  await load();
  await Vault.init();
  await Lock.init();
  if (Vault.cfg && !Vault.key) showLock('password');
  else if (Lock.active() && Lock.expired()) showLock(Lock.cfg.mode);
  render();
  if (Vault.key) Vault.schedule(1200);
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (_) {}
  if (!PREVIEW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  setTimeout(resolveMissingLabels, 1500);
  setTimeout(() => checkUpdate(false), 2500);
})();
</script>
